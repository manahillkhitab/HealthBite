<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HealthBite — AI-powered food health classification and smart nutrition recommendations using ensemble machine learning.">
    <title>{% block title %}HealthBite — AI Food Health Classifier{% endblock %}</title>

    <!-- Fonts (loaded before CSS so no FOUT) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3.1">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="{{ url_for('index') }}" class="nav-brand">
                <span class="logo-pill">🥗</span>
                <span class="brand-text">HealthBite</span>
            </a>
            <ul class="nav-menu">
                <li><a href="{{ url_for('index') }}"     class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Home</a></li>
                <li><a href="{{ url_for('analyze') }}"   class="nav-link {% if request.endpoint == 'analyze' %}active{% endif %}">Analyze</a></li>
                <li><a href="{{ url_for('dashboard') }}" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">Dashboard</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
        <p>HealthBite &mdash; Ensemble ML Food Classifier &middot; KNN &middot; SVM &middot; Naive Bayes</p>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
